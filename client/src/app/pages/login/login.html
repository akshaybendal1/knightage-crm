<div class="login-wrap">
  <div class="card card-round login-card">
    <div class="card-body">
      <h2 class="fw-bold mb-4">{{ mode() === 'login' ? 'Log in to Knightage CRM' : 'Create your organization' }}</h2>
      <form (ngSubmit)="submit()">
        @if (mode() === 'register') {
          <div class="form-group mb-3">
            <label class="form-label" for="organizationName">Organization name</label>
            <input id="organizationName" name="organizationName" type="text" class="form-control" [(ngModel)]="organizationName" required />
          </div>
          <div class="form-group mb-3">
            <label class="form-label" for="displayName">Your name</label>
            <input id="displayName" name="displayName" type="text" class="form-control" [(ngModel)]="displayName" required />
          </div>
        }
        <div class="form-group mb-3">
          <label class="form-label" for="email">Email</label>
          <input id="email" name="email" type="email" class="form-control" [(ngModel)]="email" required />
        </div>
        <div class="form-group mb-4">
          <label class="form-label" for="password">Password</label>
          <input id="password" name="password" type="password" class="form-control" [(ngModel)]="password" required minlength="8" />
        </div>

        @if (errorMessage()) {
          <div class="alert alert-danger py-2">{{ errorMessage() }}</div>
        }

        <button type="submit" class="btn btn-primary w-100" [disabled]="loading()">
          {{ loading() ? 'Please wait...' : mode() === 'login' ? 'Log in' : 'Create organization' }}
        </button>

        <p class="text-muted text-center mt-3 mb-0">
          @if (mode() === 'login') {
            New here?
            <a href="javascript:void(0)" (click)="toggleMode()">Create an organization</a>
          } @else {
            Already have an account?
            <a href="javascript:void(0)" (click)="toggleMode()">Log in instead</a>
          }
        </p>
      </form>
    </div>
  </div>
</div>
