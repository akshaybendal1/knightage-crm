<div class="d-flex align-items-start align-items-md-center justify-content-between flex-column flex-md-row gap-2 pt-2 pb-3">
  <h3 class="fw-bold mb-0">My Profile</h3>
</div>

@if (loading()) {
  <app-loader />
} @else {
  <div class="row">
    <div class="col-md-6">
      <div class="card card-round">
        <div class="card-header">
          <div class="card-title">Details</div>
        </div>
        <div class="card-body">
          <form (ngSubmit)="saveProfile()">
            <div class="form-group mb-3">
              <label class="form-label" for="email">Email</label>
              <input id="email" name="email" type="email" class="form-control" [value]="email" disabled />
            </div>
            <div class="form-group mb-3">
              <label class="form-label" for="displayName">Name</label>
              <input id="displayName" name="displayName" type="text" class="form-control" [(ngModel)]="displayName" required />
            </div>
            <div class="form-group mb-3">
              <label class="form-label" for="phoneNumber">Phone</label>
              <input id="phoneNumber" name="phoneNumber" type="tel" class="form-control" [(ngModel)]="phoneNumber" />
            </div>
            <div class="form-group mb-3">
              <label class="form-label">Role</label>
              <div><span class="badge badge-secondary">{{ role }}</span></div>
            </div>
            @if (errorMessage()) {
              <div class="alert alert-danger py-2">{{ errorMessage() }}</div>
            }
            <button type="submit" class="btn btn-primary" [disabled]="saving()">{{ saving() ? 'Saving...' : 'Save' }}</button>
          </form>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card card-round">
        <div class="card-header">
          <div class="card-title">Change password</div>
        </div>
        <div class="card-body">
          <form (ngSubmit)="changePassword()">
            <div class="form-group mb-3">
              <label class="form-label" for="currentPassword">Current password</label>
              <input id="currentPassword" name="currentPassword" type="password" class="form-control" [(ngModel)]="currentPassword" required />
            </div>
            <div class="form-group mb-3">
              <label class="form-label" for="newPassword">New password</label>
              <input id="newPassword" name="newPassword" type="password" class="form-control" [(ngModel)]="newPassword" required minlength="8" />
            </div>
            <div class="form-group mb-3">
              <label class="form-label" for="confirmPassword">Confirm new password</label>
              <input id="confirmPassword" name="confirmPassword" type="password" class="form-control" [(ngModel)]="confirmPassword" required />
            </div>
            @if (passwordError()) {
              <div class="alert alert-danger py-2">{{ passwordError() }}</div>
            }
            <button type="submit" class="btn btn-primary" [disabled]="changingPassword()">
              {{ changingPassword() ? 'Changing...' : 'Change password' }}
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
}
