<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Knightage CRM — Maintenance</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f1729;
    color: #e6e9f0;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .card {
    max-width: 440px;
    width: 100%;
    background: #16213a;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  .icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    border-radius: 14px;
    background: linear-gradient(135deg, #f97316, #ea580c);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 10px;
    font-weight: 700;
  }
  p {
    font-size: 14px;
    line-height: 1.6;
    color: #9aa4bf;
    margin: 0 0 6px;
  }
  .brand {
    margin-top: 28px;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #5c6784;
  }
  .dots span {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #f97316;
    margin: 0 3px;
    animation: pulse 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="icon">⚙️</div>
      <h1>Quick maintenance in progress</h1>
      <p>We're deploying an update to Knightage CRM.</p>
      <p>This usually takes a couple of minutes — please check back shortly.</p>
      <div class="dots" style="margin-top:18px;"><span></span><span></span><span></span></div>
      <div class="brand">Knightage CRM</div>
    </div>
  </div>
</body>
</html>
